# One always-on RollMarkets L3 miner on Fly: rollmarkets-miner-N (N = 1..3), ams, the public image GitHub Actions builds on
# every push to this repo. `infra/miner/deploy.sh N` creates the app, its 1 GB volume and its key secret, then deploys THIS
# file with `--app rollmarkets-miner-N` (the `app` below is the template's; the flag wins). docs: infra/miner/README.md,
# infra/miner/RUNBOOK.md, and docs/L3-MINERS.md §10 in the proto monorepo.
#
# The process is `node src/miner/run.mjs` in FLEET mode (no L3_SHARD): it follows the engine's /v1/l3/markets every minute
# and runs one miner per listed shard, plus whatever L3_SHARDS names (unset in production; a staged test sets it as a
# temporary secret — secrets override [env]). One log connection, one signature verifier, a journal per shard on /data.
app = "rollmarkets-miner-1"
primary_region = "ams"

[build]
  image = "ghcr.io/dubthecat/rolla-miner:latest"

[env]
  DATA_DIR = "/data"
  PORT = "8080"
  L3_LOG = "kafka"
  L3_KAFKA_BROKERS = "rolla-l3-broker.fly.dev:9092"
  # the engine whose shard list this miner follows (GET /v1/l3/markets): the live venue
  L3_ENGINE_URL = "https://rollmarkets.com"
  L3_MARKETS_POLL_MS = "60000"
  # the EIP-712 domain the orders are signed under (RollaBookL3 with the engine on L3_SETTLE=root) and the book whose
  # L3Final the miner signs: the ACTIVE v3 pair since the versioned redeploy of 2026-10-04 (the rc book 0xa1d5…4450 is
  # retired). deploy.sh sets both from BOOK_L3 (same default) when the contract is redeployed.
  PREDICT_BOOK = "0xfc39ab228ec5a77e681f2fa3c9491ca07456c9bc"
  PREDICT_BOOK_L3 = "0xfc39ab228ec5a77e681f2fa3c9491ca07456c9bc"
  CHAIN_ID = "46630"
  # the only sequencer whose batches count: the engine operator. Anything else stalls the shard (and the health check).
  L3_SEQUENCERS = "0x4f2689f90a854173d5AC9Ac44c318D79011D3267"
  L3_THRESHOLD = "2"
  # shared-cpu-2x: one verification worker thread beside the main thread
  L3_VERIFY_WORKERS = "1"
  # L3_COMMIT is left at its default (bookhash): it must equal the engine's, and the engine runs the default

[mounts]
  source = "minerdata"
  destination = "/data"

# /healthz (200 while every shard is sound, 503 on a stall, a dissent or a vote backlog) and /metrics, public over HTTPS at
# https://rollmarkets-miner-N.fly.dev/ — read-only, no secrets. The machine never stops: a miner that is off is a miner that
# does not vote.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
