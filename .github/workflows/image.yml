name: build miner image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dubthecat/rolla-miner:latest
            ghcr.io/dubthecat/rolla-miner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  sim:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/sim/Dockerfile
          pull: true
          push: true
          tags: |
            ghcr.io/dubthecat/rolla-miner-sim:latest
            ghcr.io/dubthecat/rolla-miner-sim:${{ github.sha }}
